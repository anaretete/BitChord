name: Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 --decode > bitchord-release.jks

      - name: Create keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=bitchord-release.jks
          storePassword=bitchord-release
          keyAlias=bitchord
          keyPassword=bitchord-release
          EOF

      - name: Build release APK
        run: ./gradlew :app:assembleDevRelease
          -Pandroid.aapt2FromMavenOverride=$(which aapt2 || true)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-release
          path: app/build/outputs/apk/dev/release/*.apk
          retention-days: 7
